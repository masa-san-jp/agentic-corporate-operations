queue_rules:
  - READYへ遷移できるのは全dependenciesがVERIFIEDまたはCLOSEDの場合だけである
  - LEASEDは同一work itemにつき1件だけ許可する
  - 競合するeditable_pathsを持つwork itemを同時にLEASEDへしない
  - 上位依存の変更時は関連Work PackageをBLOCKED_DEPENDENCYへ戻す
  - TIMED_OUT時はHandoffの作成とLease解除を必要とする
